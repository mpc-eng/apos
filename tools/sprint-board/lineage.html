<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APOS Lineage Graph</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-hover: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --orange: #db6d28;
    --purple: #bc8cff;
    --pink: #f778ba;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

  /* Header */
  .header { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; background: var(--bg); z-index: 100; position: relative; }
  .header h1 { font-size: 18px; font-weight: 600; white-space: nowrap; }
  .nav-links { display: flex; gap: 4px; }
  .nav-link { color: var(--text-muted); text-decoration: none; font-size: 13px; padding: 4px 10px; border-radius: 6px; transition: all 0.15s; }
  .nav-link:hover { color: var(--text); background: var(--surface); }
  .nav-link.active { color: var(--accent); background: rgba(88,166,255,0.1); }
  .app-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: var(--radius); font-size: 14px; cursor: pointer; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  /* Filter bar */
  .filter-bar { padding: 8px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; background: var(--bg); z-index: 99; position: relative; }
  .filter-chip { font-size: 11px; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; transition: all 0.15s; user-select: none; }
  .filter-chip:hover { border-color: var(--text-muted); color: var(--text); }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.1); }
  .filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .filter-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Canvas container */
  .graph-container { position: relative; width: 100%; height: calc(100vh - 90px); }
  .graph-container.has-filters { height: calc(100vh - 126px); }

  /* SVG */
  svg { width: 100%; height: 100%; }

  /* Nodes */
  .node { cursor: pointer; }
  .node circle { stroke-width: 2; transition: r 0.2s ease, stroke-width 0.2s ease; }
  .node text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif; fill: var(--text-muted); pointer-events: none; }
  .node.highlight circle { stroke-width: 3; }
  .node.highlight text { fill: var(--text); font-weight: 500; }
  .node.dim { opacity: 0.12; }
  .node.dim circle { stroke-width: 1; }

  /* Links */
  .link { fill: none; stroke-width: 1.5; }
  .link.blocks { stroke: var(--border); }
  .link.amends { stroke: var(--purple); stroke-dasharray: 4 3; }
  .link.informs { stroke: var(--accent); opacity: 0.3; stroke-dasharray: 2 4; }
  .link.highlight { stroke-width: 2.5; opacity: 1 !important; }
  .link.dim { opacity: 0.04; }

  /* Arrowheads */
  marker path { fill: var(--border); }

  /* Phase labels (background clusters) */
  .phase-bg { fill: rgba(255,255,255,0.015); stroke: var(--border); stroke-width: 1; stroke-dasharray: 4 4; rx: 12; }
  .phase-label-text { fill: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; opacity: 0.4; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif; }

  /* Detail panel */
  .detail-panel { position: absolute; top: 16px; right: 16px; width: 320px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; z-index: 50; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.4); backdrop-filter: blur(8px); max-height: calc(100vh - 160px); overflow-y: auto; }
  .detail-panel.show { display: block; animation: slideIn 0.2s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
  .detail-panel h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .detail-panel .detail-type { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .detail-panel .detail-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px solid rgba(48,54,61,0.5); }
  .detail-panel .detail-row:last-child { border-bottom: none; }
  .detail-panel .detail-label { color: var(--text-muted); }
  .detail-panel .detail-value { font-weight: 500; text-align: right; max-width: 180px; }
  .detail-section { margin-top: 14px; }
  .detail-section h4 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .detail-section .lineage-item { font-size: 12px; padding: 4px 8px; margin: 2px 0; border-radius: 4px; background: var(--bg); cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 6px; }
  .detail-section .lineage-item:hover { background: var(--surface-hover); }
  .lineage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .detail-close { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .detail-close:hover { color: var(--text); background: var(--bg); }

  /* Minimap */
  .minimap { position: absolute; bottom: 16px; right: 16px; width: 180px; height: 120px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; z-index: 40; opacity: 0.7; transition: opacity 0.2s; }
  .minimap:hover { opacity: 1; }
  .minimap svg { width: 100%; height: 100%; }
  .minimap-viewport { fill: rgba(88,166,255,0.1); stroke: var(--accent); stroke-width: 1; }

  /* Legend */
  .legend { position: absolute; bottom: 16px; left: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; z-index: 40; display: flex; flex-direction: column; gap: 6px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); }
  .legend-circle { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; flex-shrink: 0; }
  .legend-line { width: 20px; height: 0; border-top: 2px solid; flex-shrink: 0; }
  .legend-line.dashed { border-top-style: dashed; }
  .legend-line.dotted { border-top: 2px dotted; }

  /* Zoom controls */
  .zoom-controls { position: absolute; top: 16px; left: 16px; display: flex; flex-direction: column; gap: 2px; z-index: 40; }
  .zoom-btn { width: 36px; height: 36px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.15s; }
  .zoom-btn:hover { color: var(--text); border-color: var(--text-muted); }
  .zoom-btn:first-child { border-radius: 6px 6px 2px 2px; }
  .zoom-btn:last-child { border-radius: 2px 2px 6px 6px; }

  /* Stats ribbon */
  .stats-ribbon { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 20px; z-index: 40; }
  .stat-item { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
  .stat-item .stat-num { font-weight: 700; font-size: 13px; color: var(--text); }

  /* Empty state */
  .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 8px; color: var(--text-muted); }
  .empty-state h2 { font-size: 16px; font-weight: 500; }
  .empty-state p { font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <div class="nav-links">
    <a class="nav-link" href="/">Pipeline</a>
    <a class="nav-link" href="#" id="sprintLink">Sprint</a>
    <a class="nav-link active" href="#">Lineage</a>
    <a class="nav-link" href="#" id="metricsLink">Metrics</a>
    <a class="nav-link" href="#" id="decisionsLink">Decisions</a>
  </div>
  <h1>Lineage Graph</h1>
  <div class="header-right">
    <select class="app-select" id="appSelect"></select>
  </div>
</div>

<div class="filter-bar" id="filterBar">
  <span class="filter-label">Show:</span>
  <div class="filter-chip active" data-filter="all">All</div>
  <div class="filter-sep"></div>
  <div class="filter-chip active" data-filter="idea">Ideas</div>
  <div class="filter-chip active" data-filter="foundation">Foundation</div>
  <div class="filter-chip active" data-filter="spec">Specs</div>
  <div class="filter-chip active" data-filter="build">Build Steps</div>
  <div class="filter-chip active" data-filter="amendment">Amendments</div>
  <div class="filter-chip active" data-filter="milestone">Milestones</div>
  <div class="filter-sep"></div>
  <span class="filter-label">Sprint:</span>
  <div class="filter-chip active" data-sprint="all">All</div>
</div>

<div class="graph-container has-filters" id="graphContainer">
  <div class="zoom-controls">
    <button class="zoom-btn" id="zoomIn" title="Zoom in">+</button>
    <button class="zoom-btn" id="zoomReset" title="Reset view">R</button>
    <button class="zoom-btn" id="zoomOut" title="Zoom out">&minus;</button>
  </div>

  <div class="stats-ribbon" id="statsRibbon"></div>

  <svg id="graphSvg"></svg>

  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" onclick="closeDetail()">&times;</button>
    <div id="detailContent"></div>
  </div>

  <div class="legend">
    <div class="legend-row"><div class="legend-circle" style="border-color: var(--accent); background: rgba(88,166,255,0.15)"></div> Idea / Signal</div>
    <div class="legend-row"><div class="legend-circle" style="border-color: var(--purple); background: rgba(188,140,255,0.15)"></div> Foundation</div>
    <div class="legend-row"><div class="legend-circle" style="border-color: var(--green); background: rgba(63,185,80,0.15)"></div> Spec / Build</div>
    <div class="legend-row"><div class="legend-circle" style="border-color: var(--yellow); background: rgba(210,153,34,0.15)"></div> Review / Gate</div>
    <div class="legend-row"><div class="legend-circle" style="border-color: var(--pink); background: rgba(247,120,186,0.15)"></div> Amendment</div>
    <div class="legend-row"><div class="legend-circle" style="border-color: var(--orange); background: rgba(219,109,40,0.15)"></div> Milestone</div>
    <div class="legend-row" style="margin-top: 4px"><div class="legend-line" style="border-color: var(--border)"></div> Blocks / Depends</div>
    <div class="legend-row"><div class="legend-line dashed" style="border-color: var(--purple)"></div> Amends</div>
    <div class="legend-row"><div class="legend-line dotted" style="border-color: var(--accent)"></div> Informs</div>
  </div>
</div>

<script>
function escapeHTML(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── Config ──
const NODE_COLORS = {
  idea:       { stroke: '#58a6ff', fill: 'rgba(88,166,255,0.15)' },
  triage:     { stroke: '#58a6ff', fill: 'rgba(88,166,255,0.1)' },
  foundation: { stroke: '#bc8cff', fill: 'rgba(188,140,255,0.15)' },
  spec:       { stroke: '#3fb950', fill: 'rgba(63,185,80,0.15)' },
  code:       { stroke: '#3fb950', fill: 'rgba(63,185,80,0.1)' },
  compile:    { stroke: '#3fb950', fill: 'rgba(63,185,80,0.08)' },
  test:       { stroke: '#3fb950', fill: 'rgba(63,185,80,0.1)' },
  review:     { stroke: '#d29922', fill: 'rgba(210,153,34,0.15)' },
  amendment:  { stroke: '#f778ba', fill: 'rgba(247,120,186,0.15)' },
  milestone:  { stroke: '#db6d28', fill: 'rgba(219,109,40,0.15)' },
  override:   { stroke: '#f85149', fill: 'rgba(248,81,73,0.15)' },
  retro:      { stroke: '#d29922', fill: 'rgba(210,153,34,0.1)' },
};

const NODE_SIZES = {
  idea: 18, triage: 14, foundation: 12, spec: 16,
  code: 10, compile: 8, test: 10, review: 12,
  amendment: 14, milestone: 20, override: 12, retro: 12,
};

const CATEGORY_MAP = {
  idea: 'idea', triage: 'idea', override: 'idea',
  foundation: 'foundation',
  spec: 'spec',
  code: 'build', compile: 'build', test: 'build', review: 'build',
  amendment: 'amendment',
  milestone: 'milestone', retro: 'milestone',
};

// ── State ──
let globalState = null;
let currentSlug = null;
let graphData = null;
let simulation = null;
let selectedNode = null;
let activeFilters = new Set(['idea', 'foundation', 'spec', 'build', 'amendment', 'milestone']);
let activeSprint = 'all';
let svgGroup = null;
let zoom = null;

// ── Init ──
async function init() {
  globalState = await fetchJSON('/api/state');
  const urlSlug = window.location.pathname.match(/^\/lineage\/([a-z0-9-]+)$/)?.[1];
  const defaultSlug = urlSlug || globalState.active_app_slug;

  const select = document.getElementById('appSelect');
  for (const app of globalState.app_registry) {
    const opt = document.createElement('option');
    opt.value = app.slug;
    opt.textContent = `${app.name} (${app.current_stage})`;
    if (app.slug === defaultSlug) opt.selected = true;
    select.appendChild(opt);
  }
  select.addEventListener('change', () => {
    history.replaceState(null, '', `/lineage/${select.value}`);
    loadApp(select.value);
  });

  document.getElementById('sprintLink').href = `/sprint/${defaultSlug}`;
  document.getElementById('metricsLink').href = `/metrics/${defaultSlug}`;
  document.getElementById('decisionsLink').href = `/decisions/${defaultSlug}`;
  setupFilters();
  setupZoom();
  loadApp(defaultSlug);
}

async function loadApp(slug) {
  currentSlug = slug;
  document.getElementById('sprintLink').href = `/sprint/${slug}`;
  document.getElementById('metricsLink').href = `/metrics/${slug}`;
  document.getElementById('decisionsLink').href = `/decisions/${slug}`;
  const appData = await fetchJSON(`/api/app/${slug}/lineage`);
  graphData = appData;
  buildSprintFilters();
  renderGraph();
  updateStats();
}

async function fetchJSON(url) {
  const res = await fetch(url);
  return res.json();
}

// ── Build graph from lineage data ──
function getFilteredGraph() {
  if (!graphData) return { nodes: [], links: [] };
  const nodes = graphData.nodes.filter(n => {
    const cat = CATEGORY_MAP[n.type] || n.type;
    if (!activeFilters.has(cat)) return false;
    if (activeSprint !== 'all' && n.sprint != null && n.sprint !== activeSprint) return false;
    return true;
  });
  const nodeIds = new Set(nodes.map(n => n.id));
  const links = graphData.links.filter(l => nodeIds.has(l.source?.id || l.source) && nodeIds.has(l.target?.id || l.target));
  return { nodes, links };
}

// ── Render ──
function renderGraph() {
  const container = document.getElementById('graphContainer');
  const svg = d3.select('#graphSvg');
  svg.selectAll('*').remove();
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Defs — arrowheads
  const defs = svg.append('defs');
  ['blocks', 'amends', 'informs'].forEach(type => {
    defs.append('marker')
      .attr('id', `arrow-${type}`)
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 20).attr('refY', 0)
      .attr('markerWidth', 6).attr('markerHeight', 6)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-4L10,0L0,4')
      .attr('fill', type === 'amends' ? '#bc8cff' : type === 'informs' ? '#58a6ff' : '#30363d');
  });

  // Glow filter
  const glow = defs.append('filter').attr('id', 'glow');
  glow.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
  glow.append('feMerge').selectAll('feMergeNode')
    .data(['blur', 'SourceGraphic']).enter()
    .append('feMergeNode').attr('in', d => d);

  const g = svg.append('g');
  svgGroup = g;

  // Zoom
  zoom = d3.zoom()
    .scaleExtent([0.15, 4])
    .on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  const { nodes, links } = getFilteredGraph();
  if (nodes.length === 0) {
    g.append('text').attr('x', width/2).attr('y', height/2)
      .attr('text-anchor', 'middle').attr('fill', '#8b949e')
      .attr('font-size', 14).text('No nodes match current filters');
    return;
  }

  // Force simulation — horizontal flow layout
  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => {
      const st = d.source.type || 'spec';
      const tt = d.target.type || 'spec';
      if (st === 'idea' || tt === 'idea') return 140;
      if (st === 'foundation' || tt === 'foundation') return 80;
      return 60;
    }).strength(0.8))
    .force('charge', d3.forceManyBody().strength(d => {
      if (d.type === 'idea' || d.type === 'milestone') return -400;
      if (d.type === 'spec') return -250;
      return -120;
    }))
    .force('x', d3.forceX(d => {
      // Horizontal flow: idea → foundation → spec → build → milestone
      const order = { idea: 0, triage: 0.5, override: 0.5, foundation: 1, spec: 2, code: 2.8, compile: 3, test: 3.2, review: 3.5, amendment: 3.8, milestone: 4.5, retro: 4.5 };
      return (order[d.type] || 2) * (width / 5.5) + 80;
    }).strength(0.3))
    .force('y', d3.forceY(d => {
      // Vertical grouping by sprint
      if (d.sprint != null) return 100 + d.sprint * 120;
      if (d.type === 'idea' || d.type === 'triage') return height / 2;
      return height / 2;
    }).strength(0.08))
    .force('collision', d3.forceCollide(d => (NODE_SIZES[d.type] || 12) + 6))
    .alpha(0.8)
    .alphaDecay(0.015);

  // Links
  const link = g.append('g').attr('class', 'links')
    .selectAll('path')
    .data(links).enter()
    .append('path')
    .attr('class', d => `link ${d.type || 'blocks'}`)
    .attr('marker-end', d => `url(#arrow-${d.type || 'blocks'})`);

  // Node groups
  const node = g.append('g').attr('class', 'nodes')
    .selectAll('g')
    .data(nodes).enter()
    .append('g')
    .attr('class', 'node')
    .call(d3.drag()
      .on('start', dragStart)
      .on('drag', dragging)
      .on('end', dragEnd))
    .on('click', (e, d) => { e.stopPropagation(); selectNode(d); })
    .on('mouseenter', (e, d) => highlightLineage(d))
    .on('mouseleave', () => { if (!selectedNode) clearHighlight(); });

  // Node circles
  node.append('circle')
    .attr('r', d => NODE_SIZES[d.type] || 12)
    .attr('fill', d => (NODE_COLORS[d.type] || NODE_COLORS.spec).fill)
    .attr('stroke', d => {
      if (d.status === 'failed') return '#f85149';
      if (d.status === 'in_progress') return '#d29922';
      return (NODE_COLORS[d.type] || NODE_COLORS.spec).stroke;
    })
    .attr('filter', d => (d.type === 'idea' || d.type === 'milestone') ? 'url(#glow)' : null);

  // Node icons (small text inside)
  node.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', '0.35em')
    .attr('font-size', d => Math.max(8, (NODE_SIZES[d.type] || 12) * 0.55))
    .attr('fill', d => (NODE_COLORS[d.type] || NODE_COLORS.spec).stroke)
    .attr('font-weight', 600)
    .text(d => {
      const icons = { idea: 'I', triage: 'T', foundation: 'F', spec: 'S', code: 'C', compile: 'B', test: 'T', review: 'R', amendment: 'A', milestone: 'M', override: '!', retro: 'RT' };
      return icons[d.type] || '?';
    });

  // Node labels
  node.append('text')
    .attr('dx', d => (NODE_SIZES[d.type] || 12) + 6)
    .attr('dy', '0.35em')
    .attr('font-size', d => d.type === 'idea' || d.type === 'milestone' ? 12 : 10)
    .attr('fill', '#8b949e')
    .text(d => d.label.length > 28 ? d.label.slice(0, 26) + '...' : d.label);

  // Status indicator (small dot)
  node.filter(d => d.status === 'completed')
    .append('circle')
    .attr('cx', d => (NODE_SIZES[d.type] || 12) * 0.6)
    .attr('cy', d => -(NODE_SIZES[d.type] || 12) * 0.6)
    .attr('r', 3)
    .attr('fill', '#3fb950')
    .attr('stroke', 'none');

  node.filter(d => d.status === 'failed')
    .append('circle')
    .attr('cx', d => (NODE_SIZES[d.type] || 12) * 0.6)
    .attr('cy', d => -(NODE_SIZES[d.type] || 12) * 0.6)
    .attr('r', 3)
    .attr('fill', '#f85149')
    .attr('stroke', 'none');

  // Tick
  simulation.on('tick', () => {
    link.attr('d', d => {
      const dx = d.target.x - d.source.x;
      const dy = d.target.y - d.source.y;
      const dr = Math.sqrt(dx*dx + dy*dy) * 2;
      return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
    });
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  // Click background to deselect
  svg.on('click', () => { selectedNode = null; clearHighlight(); closeDetail(); });

  // Initial zoom to fit
  simulation.on('end', () => zoomToFit(svg, g, width, height));
  setTimeout(() => zoomToFit(svg, g, width, height), 2000);
}

function zoomToFit(svg, g, width, height) {
  const bounds = g.node().getBBox();
  if (bounds.width === 0 || bounds.height === 0) return;
  const padding = 80;
  const fullWidth = bounds.width + padding * 2;
  const fullHeight = bounds.height + padding * 2;
  const scale = Math.min(width / fullWidth, height / fullHeight, 1.5);
  const tx = width / 2 - (bounds.x + bounds.width / 2) * scale;
  const ty = height / 2 - (bounds.y + bounds.height / 2) * scale;
  svg.transition().duration(600).call(
    zoom.transform,
    d3.zoomIdentity.translate(tx, ty).scale(scale)
  );
}

// ── Interaction ──
function selectNode(d) {
  selectedNode = d;
  highlightLineage(d);
  showDetail(d);
}

function highlightLineage(d) {
  const connected = getConnectedNodes(d.id);
  connected.add(d.id);
  d3.selectAll('.node')
    .classed('highlight', n => connected.has(n.id))
    .classed('dim', n => !connected.has(n.id));
  d3.selectAll('.link')
    .classed('highlight', l => connected.has(l.source.id) && connected.has(l.target.id))
    .classed('dim', l => !connected.has(l.source.id) || !connected.has(l.target.id));
}

function clearHighlight() {
  d3.selectAll('.node').classed('highlight', false).classed('dim', false);
  d3.selectAll('.link').classed('highlight', false).classed('dim', false);
}

function getConnectedNodes(nodeId) {
  const connected = new Set();
  if (!graphData) return connected;
  // Walk upstream
  const walkUp = id => {
    for (const l of graphData.links) {
      const sid = l.source?.id || l.source;
      const tid = l.target?.id || l.target;
      if (tid === id && !connected.has(sid)) { connected.add(sid); walkUp(sid); }
    }
  };
  // Walk downstream
  const walkDown = id => {
    for (const l of graphData.links) {
      const sid = l.source?.id || l.source;
      const tid = l.target?.id || l.target;
      if (sid === id && !connected.has(tid)) { connected.add(tid); walkDown(tid); }
    }
  };
  walkUp(nodeId);
  walkDown(nodeId);
  return connected;
}

function showDetail(d) {
  const panel = document.getElementById('detailPanel');
  const content = document.getElementById('detailContent');

  const color = (NODE_COLORS[d.type] || NODE_COLORS.spec).stroke;
  let html = `
    <h3 style="color:${color}">${escapeHTML(d.label)}</h3>
    <div class="detail-type">${escapeHTML(d.type)}${d.sprint != null ? ` &middot; Sprint ${d.sprint}` : ''}${d.phase != null ? ` &middot; Phase ${d.phase}` : ''}</div>
  `;

  // Properties
  const props = [];
  if (d.status) props.push(['Status', statusBadge(d.status)]);
  if (d.agent) props.push(['Agent', `[${escapeHTML(d.agent)}]`]);
  if (d.output_path) props.push(['Output', `<span style="font-family:monospace;font-size:10px">${escapeHTML(d.output_path)}</span>`]);
  if (d.retry_count > 0) props.push(['Retries', `<span style="color:var(--yellow)">${d.retry_count}</span>`]);
  if (d.completed_at) props.push(['Completed', formatDate(d.completed_at)]);
  if (d.tests_total) props.push(['Tests', `${d.tests_passed || 0}/${d.tests_total} passed`]);
  if (d.score != null) props.push(['Score', `${d.score}/5`]);
  if (d.override_reason) props.push(['Override', `<span style="color:var(--red);font-size:11px">${escapeHTML(d.override_reason)}</span>`]);

  if (props.length > 0) {
    html += props.map(([k, v]) => `<div class="detail-row"><span class="detail-label">${k}</span><span class="detail-value">${v}</span></div>`).join('');
  }

  // Upstream lineage
  const upstream = getUpstream(d.id);
  if (upstream.length > 0) {
    html += `<div class="detail-section"><h4>Upstream (depends on)</h4>`;
    html += upstream.map(n => `
      <div class="lineage-item" onclick="focusNode('${escapeHTML(n.id)}')">
        <div class="lineage-dot" style="background:${(NODE_COLORS[n.type] || NODE_COLORS.spec).stroke}"></div>
        ${escapeHTML(n.label)}
      </div>
    `).join('');
    html += `</div>`;
  }

  // Downstream lineage
  const downstream = getDownstream(d.id);
  if (downstream.length > 0) {
    html += `<div class="detail-section"><h4>Downstream (enables)</h4>`;
    html += downstream.map(n => `
      <div class="lineage-item" onclick="focusNode('${escapeHTML(n.id)}')">
        <div class="lineage-dot" style="background:${(NODE_COLORS[n.type] || NODE_COLORS.spec).stroke}"></div>
        ${escapeHTML(n.label)}
      </div>
    `).join('');
    html += `</div>`;
  }

  content.innerHTML = html;
  panel.classList.add('show');
}

function getUpstream(nodeId) {
  const result = [];
  if (!graphData) return result;
  for (const l of graphData.links) {
    const sid = l.source?.id || l.source;
    const tid = l.target?.id || l.target;
    if (tid === nodeId) {
      const node = graphData.nodes.find(n => n.id === sid);
      if (node) result.push(node);
    }
  }
  return result;
}

function getDownstream(nodeId) {
  const result = [];
  if (!graphData) return result;
  for (const l of graphData.links) {
    const sid = l.source?.id || l.source;
    const tid = l.target?.id || l.target;
    if (sid === nodeId) {
      const node = graphData.nodes.find(n => n.id === tid);
      if (node) result.push(node);
    }
  }
  return result;
}

function focusNode(nodeId) {
  const node = graphData.nodes.find(n => n.id === nodeId);
  if (!node) return;
  selectNode(node);
  // Pan to node
  const svg = d3.select('#graphSvg');
  const container = document.getElementById('graphContainer');
  const w = container.clientWidth;
  const h = container.clientHeight;
  const currentTransform = d3.zoomTransform(svg.node());
  const scale = currentTransform.k;
  svg.transition().duration(400).call(
    zoom.transform,
    d3.zoomIdentity.translate(w/2 - node.x * scale, h/2 - node.y * scale).scale(scale)
  );
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('show');
}

function statusBadge(status) {
  const colors = { completed: 'var(--green)', failed: 'var(--red)', in_progress: 'var(--yellow)', pending: 'var(--text-muted)' };
  const c = colors[status] || 'var(--text-muted)';
  return `<span style="color:${c}">${escapeHTML(status.replace('_', ' '))}</span>`;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

// ── Drag ──
function dragStart(event, d) {
  if (!event.active) simulation.alphaTarget(0.1).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragging(event, d) {
  d.fx = event.x; d.fy = event.y;
}
function dragEnd(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ── Filters ──
function setupFilters() {
  document.querySelectorAll('.filter-chip[data-filter]').forEach(chip => {
    chip.addEventListener('click', () => {
      const filter = chip.dataset.filter;
      if (filter === 'all') {
        const allActive = activeFilters.size === 6;
        activeFilters = allActive ? new Set() : new Set(['idea', 'foundation', 'spec', 'build', 'amendment', 'milestone']);
        document.querySelectorAll('.filter-chip[data-filter]').forEach(c => {
          if (c.dataset.filter === 'all') c.classList.toggle('active', !allActive);
          else c.classList.toggle('active', !allActive);
        });
      } else {
        chip.classList.toggle('active');
        if (chip.classList.contains('active')) activeFilters.add(filter);
        else activeFilters.delete(filter);
        // Update "All" chip
        document.querySelector('.filter-chip[data-filter="all"]')
          .classList.toggle('active', activeFilters.size === 6);
      }
      renderGraph();
      updateStats();
    });
  });
}

function buildSprintFilters() {
  // Remove existing sprint filters except "All"
  document.querySelectorAll('.filter-chip[data-sprint]').forEach(c => {
    if (c.dataset.sprint !== 'all') c.remove();
  });
  if (!graphData) return;
  const sprints = new Set(graphData.nodes.filter(n => n.sprint != null).map(n => n.sprint));
  const allChip = document.querySelector('.filter-chip[data-sprint="all"]');
  [...sprints].sort().forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'filter-chip active';
    chip.dataset.sprint = s;
    chip.textContent = `S${s}`;
    chip.addEventListener('click', () => {
      if (activeSprint === String(s)) {
        activeSprint = 'all';
        document.querySelectorAll('.filter-chip[data-sprint]').forEach(c => c.classList.add('active'));
      } else {
        activeSprint = String(s);
        document.querySelectorAll('.filter-chip[data-sprint]').forEach(c => {
          c.classList.toggle('active', c.dataset.sprint === String(s) || c.dataset.sprint === 'all');
        });
        allChip.classList.remove('active');
      }
      renderGraph();
      updateStats();
    });
    allChip.parentNode.appendChild(chip);
  });
}

function setupZoom() {
  document.getElementById('zoomIn').addEventListener('click', () => {
    d3.select('#graphSvg').transition().duration(200).call(zoom.scaleBy, 1.4);
  });
  document.getElementById('zoomOut').addEventListener('click', () => {
    d3.select('#graphSvg').transition().duration(200).call(zoom.scaleBy, 0.7);
  });
  document.getElementById('zoomReset').addEventListener('click', () => {
    const svg = d3.select('#graphSvg');
    const container = document.getElementById('graphContainer');
    if (svgGroup) zoomToFit(svg, svgGroup, container.clientWidth, container.clientHeight);
  });
}

// ── Stats ──
function updateStats() {
  const { nodes, links } = getFilteredGraph();
  const completed = nodes.filter(n => n.status === 'completed').length;
  const failed = nodes.filter(n => n.status === 'failed').length;
  const specs = nodes.filter(n => n.type === 'spec').length;
  const amendments = nodes.filter(n => n.type === 'amendment').length;

  document.getElementById('statsRibbon').innerHTML = `
    <div class="stat-item"><span class="stat-num">${nodes.length}</span> nodes</div>
    <div class="stat-item"><span class="stat-num">${links.length}</span> edges</div>
    <div class="stat-item"><span class="stat-num">${specs}</span> specs</div>
    ${amendments > 0 ? `<div class="stat-item"><span class="stat-num" style="color:var(--pink)">${amendments}</span> amendments</div>` : ''}
    ${failed > 0 ? `<div class="stat-item"><span class="stat-num" style="color:var(--red)">${failed}</span> failed</div>` : ''}
    <div class="stat-item"><span class="stat-num" style="color:var(--green)">${completed}</span> completed</div>
  `;
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { selectedNode = null; clearHighlight(); closeDetail(); }
});

// ── D3 loader ──
function loadD3() {
  return new Promise(resolve => {
    const script = document.createElement('script');
    script.src = 'https://d3js.org/d3.v7.min.js';
    script.onload = resolve;
    document.head.appendChild(script);
  });
}

loadD3().then(init);
</script>
</body>
